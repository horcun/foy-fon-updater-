name: TEFAS Fon Güncelle

on:
  repository_dispatch:
    types: [run-tefas]
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fon fiyatlarını güncelle
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python update_fon.py
