name: Altın Sertifikası Arşivi

# FÖY, Darphane altın sertifikasını (ALTINS1) Borsa İstanbul altında destekliyor.
# Yahoo bu kağıdı tanımadığı için geçmiş seri bu deponun gecmis/ALTINS1.json
# dosyasından okunur (fonlarla aynı biçim). Kural: update_sertifika.py başlığı.
#
# Yalnız canlı seansta anlamlı (10:10–18:00 TSİ). Gün bir kez yazılır; sonraki
# koşular hiçbir şeyi değiştirmez, yani fazladan koşu zararsızdır.
#
# 11 Eki 2026 — ARŞİV HİÇ YAZMADI: yalnız 12:40/16:40 TSİ zamanlayıcısı vardı.
# 8 Eki'de koşu 19:24 UTC'ye (seans dışı) kaydı, 9 Eki'de hiç başlamadı →
# "seans değil" deyip sessizce çıktı. GitHub zamanlayıcısı gecikebilir ya da
# atlanabilir; seans penceresi dar olduğu için tek tetiğe güvenilmez. Üç katman:
#   1) TEFAS güncelleyicisi bittiğinde (workflow_run) — onun 10:10 TSİ koşusu
#      her iş günü dakikasında başlıyor (git log: 28 Eyl–9 Eki, hep 07:10 UTC).
#   2) Seans boyunca saatte bir yedek (10:40–17:40 TSİ).
#   3) Elle (workflow_dispatch).
on:
  workflow_run:
    workflows: ['TEFAS Fon Güncelle']
    types: [completed]
    # Yalnız main'deki gerçek koşu; claude/** dalındaki KURU koşu tetiklemez.
    branches: [main]
  schedule:
    - cron: '40 7-14 * * 1-5'
  workflow_dispatch:
  # claude/** dalında betik değişince gerçek veriyle KURU koşu (yazmaz, raporlar).
  push:
    branches: ['claude/**']
    paths: ['update_sertifika.py', 'test_sertifika.py', '.github/workflows/sertifika.yml']

permissions:
  contents: write

# main'deki koşular TEFAS güncelleyicisiyle aynı kuyrukta (push çakışması olmasın).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'tefas-fon-guncelle' || format('sertifika-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  arsiv:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kurallar (ağsız test)
        run: python -m unittest test_sertifika -v

      - name: Ölç ve arşive yaz
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            python update_sertifika.py
          else
            python update_sertifika.py --kuru
          fi

      - name: Arşivi commit'le
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          [ -f gecmis/ALTINS1.json ] || { echo "Arşiv dosyası yok — commit edilecek bir şey yok."; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gecmis/ALTINS1.json
          if git diff --cached --quiet; then
            echo "Arşivde değişiklik yok — commit atlanıyor."
            exit 0
          fi
          git commit -m "Altın sertifikası arşivi: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
